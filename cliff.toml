[changelog]
header = "# 更新日志\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message }}{% if commit.github.username %} (@{{ commit.github.username }}){% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
commit_parsers = [
    { message = "^feat", group = "🚀 新增" },
    { message = "^新增", group = "🚀 新增" },
    { message = "^添加", group = "🚀 新增" },
    { message = "^fix", group = "🔧 修复" },
    { message = "^修复", group = "🔧 修复" },
    { message = "^perf", group = "⚡ 优化" },
    { message = "^优化", group = "⚡ 优化" },
    { message = "^refactor", group = "🔧 重构" },
    { message = "^重构", group = "🔧 重构" },
    { message = "^docs", group = "📝 文档" },
    { message = "^文档", group = "📝 文档" },
    { message = "^chore", skip = true },
    { message = ".*", group = "其他" },
]