name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 允许创建release
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Setup WiX
      run: |
        dotnet tool install --global wix --version 7.0.0
        wix eula accept wix7
        wix extension add WixToolset.UI.wixext

    - name: Extract version from tag
      id: version
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Publish app
      run: |
        dotnet publish src/HideYourChat.App/HideYourChat.App.csproj `
          -c Release -r win-x64 --self-contained false `
          -o publish/ `
          -p:Version=${{ steps.version.outputs.version }}

    - name: Harvest files
      run: |
        powershell ./installer/generate-components.ps1 `
          -PublishDir publish `
          -OutputFile installer/PublishedComponents.wxs

    - name: Build MSI
      run: |
        wix build -ext WixToolset.UI.wixext `
          installer/HideYourChat.Setup.wxs installer/PublishedComponents.wxs `
          -d "Version=${{ steps.version.outputs.version }}" `
          -o output/HideYourChat-${{ steps.version.outputs.version }}.msi

    - name: Extract release notes
      id: notes
      shell: powershell
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $escaped = [regex]::Escape($version)
        $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
        # 统一换行为 LF，避免 Windows CRLF 导致 \n 匹配失败
        $changelog = $changelog -replace "`r`n", "`n"
        # 匹配 "## v1.0.2" 到下一个 "## v" 之间的内容
        $pattern = "(?s)^## v$escaped\s*\n(.+?)(?=\n## v|\z)"
        if ($changelog -match $pattern) {
          $notes = $matches[1].Trim()
          echo "notes<<EOF" >> $env:GITHUB_OUTPUT
          echo "$notes" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        } else {
          # 没找到对应版本，fallback 到 tag message
          $tagMsg = git tag -l --format='%(contents)' ${{ github.ref_name }}
          echo "notes<<EOF" >> $env:GITHUB_OUTPUT
          echo "$tagMsg" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        }
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "v${{ steps.version.outputs.version }}"
        files: output/HideYourChat-${{ steps.version.outputs.version }}.msi
